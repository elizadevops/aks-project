name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Глобальные переменные окружения
env:
  ACR_NAME: elizadevopsacr
  ACR_LOGIN: elizadevopsacr.azurecr.io
  WEB_IMAGE: elizadevopsacr.azurecr.io/web
  API_IMAGE: elizadevopsacr.azurecr.io/api

jobs:
  # ============================
  # 1. Линтеры, тесты, fmt, lint, security
  # ============================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ========== Node.js: lint + tests ==========
      - name: Web - lint & tests
        working-directory: n-web
        run: |
          npm ci
          npm run lint || true
          npm test || true

      - name: API - lint & tests
        working-directory: n-api
        run: |
          npm ci
          npm run lint || true
          npm test || true

      # ========== Node.js: security ==========
      - name: Web - npm audit
        working-directory: n-web
        run: npm audit --audit-level=moderate || true

      - name: API - npm audit
        working-directory: n-api
        run: npm audit --audit-level=moderate || true

      # ========== Prettier ==========
      - name: Prettier check (web)
        working-directory: n-web
        run: npx prettier --check . || true

      - name: Prettier check (api)
        working-directory: n-api
        run: npx prettier --check . || true

      # ========== Terraform ==========
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt (mysql-helm-tf)
        working-directory: mysql-helm-tf
        run: terraform fmt -check

      - name: Terraform fmt (app-helm-tf)
        working-directory: app-helm-tf
        run: terraform fmt -check

      - name: Terraform init (mysql-helm-tf)
        working-directory: mysql-helm-tf
        run: terraform init -backend=false -input=false

      - name: Terraform validate (mysql-helm-tf)
        working-directory: mysql-helm-tf
        run: terraform validate || true

      - name: Terraform init (app-helm-tf)
        working-directory: app-helm-tf
        run: terraform init -backend=false -input=false

      - name: Terraform validate (app-helm-tf)
        working-directory: app-helm-tf
        run: terraform validate || true

      # ========== Helm ==========
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint charts/web   || true
          helm lint charts/api   || true
          helm lint charts/mysql || true

      - name: Helm template dry-run
        run: |
          helm template charts/web   || true
          helm template charts/api   || true
          helm template charts/mysql || true

      # ========== Dockerfile lint ==========
      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          hadolint n-web/Dockerfile || true
          hadolint n-api/Dockerfile || true

      # ========== Kubernetes manifests validation (kubeconform вместо kubeval) ==========
      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          sudo chmod +x /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          if [ -d "kubernetes" ]; then
            echo "Validating manifests in kubernetes/..."
            kubeconform -strict -summary kubernetes/*.yaml || true
          else
            echo "No kubernetes/ directory, skipping kubeconform"
          fi

      # ========== Terrascan ==========
      - name: Install Terrascan
        run: |
          curl -L https://github.com/tenable/terrascan/releases/latest/download/terrascan_linux_amd64.tar.gz \
            -o terrascan.tar.gz
          tar -xzf terrascan.tar.gz
          sudo install terrascan /usr/local/bin/terrascan

      - name: Terrascan scan (Azure)
        run: terrascan scan -t azure || true

      # ========== Trivy FS scan ==========
      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: 0

  # ============================
  # 2. Build & Push Docker Images
  # ============================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Set image tag
        id: set-tag
        run: |
          IMAGE_TAG=${GITHUB_RUN_NUMBER}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build & push images
        run: |
          echo "Using image tag: ${IMAGE_TAG}"
          docker build -t $WEB_IMAGE:${IMAGE_TAG} ./n-web
          docker build -t $API_IMAGE:${IMAGE_TAG} ./n-api
          docker push $WEB_IMAGE:${IMAGE_TAG}
          docker push $API_IMAGE:${IMAGE_TAG}

      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.WEB_IMAGE }}:${{ steps.set-tag.outputs.image_ta
