name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Глобальные переменные окружения
env:
  ACR_NAME: elizadevopsacr
  ACR_LOGIN: elizedevopsacr.azurecr.io
  WEB_IMAGE: elizedevopsacr.azurecr.io/web
  API_IMAGE: elizedevopsacr.azurecr.io/api

jobs:
  # ============================
  # 1. Линтеры, тесты, fmt, lint, security
  # ============================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужен полный git-лог

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ========== Node.js: lint + tests ==========
      - name: Web - lint & tests
        working-directory: n-web
        run: |
          npm ci
          npm run lint || true
          npm test || true

      - name: API - lint & tests
        working-directory: n-api
        run: |
          npm ci
          npm run lint || true
          npm test || true

      # ========== Node.js: security & quality ==========
      - name: Web - npm audit
        working-directory: n-web
        run: |
          npm audit --audit-level=moderate || true

      - name: API - npm audit
        working-directory: n-api
        run: |
          npm audit --audit-level=moderate || true

      - name: Web - check outdated dependencies
        working-directory: n-web
        run: npm outdated || true

      - name: API - check outdated dependencies
        working-directory: n-api
        run: npm outdated || true

      # ========== Prettier форматирование ==========
      - name: Prettier check (web)
        working-directory: n-web
        run: npx prettier --check . || true

      - name: Prettier check (api)
        working-directory: n-api
        run: npx prettier --check . || true

      # ========== Terraform ==========
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt (mysql-helm-tf)
        working-directory: mysql-helm-tf
        run: terraform fmt -check

      - name: Terraform fmt (app-helm-tf)
        working-directory: app-helm-tf
        run: terraform fmt -check

      - name: Terraform validate (mysql-helm-tf)
        working-directory: mysql-helm-tf
        run: terraform validate || true

      - name: Terraform validate (app-helm-tf)
        working-directory: app-helm-tf
        run: terraform validate || true

      # ========== Helm ==========
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint charts/web   || true
          helm lint charts/api   || true
          helm lint charts/mysql || true

      - name: Helm template dry-run
        run: |
          helm template charts/web   || true
          helm template charts/api   || true
          helm template charts/mysql || true

      # ========== Dockerfile lint (hadolint) ==========
      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          hadolint n-web/Dockerfile || true
          hadolint n-api/Dockerfile || true

      # ========== Kubernetes YAML валидация (kubeval) ==========
      - name: Install kubeval
        run: |
          sudo wget -O /usr/local/bin/kubeval \
            https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64
          sudo chmod +x /usr/local/bin/kubeval

      - name: Validate Kubernetes YAML (if kubernetes/ exists)
        run: |
          if [ -d "kubernetes" ]; then
            kubeval kubernetes/*.yaml || true
          else
            echo "No kubernetes/ directory, skipping kubeval"
          fi

      # ========== Terrascan (security для Terraform) ==========
      - name: Install Terrascan
        run: |
          curl -L https://github.com/tenable/terrascan/releases/latest/download/terrascan_linux_amd64.tar.gz \
            -o terrascan.tar.gz
          tar -xzf terrascan.tar.gz
          sudo install terrascan /usr/local/bin/terrascan

      - name: Terrascan scan (Azure / Terraform)
        run: |
          terrascan scan -t azure || true

      # ========== Trivy FS scan (код + зависимости + IaC) ==========
      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================
  # 2. Сборка и push Docker-образов
  # ============================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Логин в Azure (через сервис-принципал, JSON в AZURE_CREDENTIALS)
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Логин в ACR
      - name: ACR login
        run: az acr login --name $ACR_NAME

      # Устанавливаем тег образа и сохраняем в outputs job'а
      - name: Set image tag
        id: set-tag
        run: |
          IMAGE_TAG=${GITHUB_RUN_NUMBER}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # Сборка и push Docker-образов web и api
      - name: Build & push images
        run: |
          echo "Using image tag: ${IMAGE_TAG}"

          docker build -t $WEB_IMAGE:${IMAGE_TAG} ./n-web
          docker build -t $API_IMAGE:${IMAGE_TAG} ./n-api

          docker push $WEB_IMAGE:${IMAGE_TAG}
          docker push $API_IMAGE:${IMAGE_TAG}

      # Trivy image scan (web)
      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Trivy image scan (api)
      - name: Trivy scan api image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================
  # 3. Обновление GitOps values + git push
  # ============================
  update-gitops:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write   # нужно для git commit + push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Подготовка git перед коммитом (чтобы не было non-fast-forward)
      - name: Prepare repo before commit
        run: |
          git config user.email "github-actions@local"
          git config user.name "github-actions"
          git fetch origin main
          git pull --rebase origin main

      # yq для правки values.yaml
      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps values
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Using image tag from build-and-push job: ${IMAGE_TAG}"

          # Обновляем теги образов в GitOps values
          yq -i ".image.tag = \"${IMAGE_TAG}\"" gitops/values/web-values.yaml
          yq -i ".image.tag = \"${IMAGE_TAG}\"" gitops/values/api-values.yaml

          git status
          git add gitops/values/web-values.yaml gitops/values/api-values.yaml
          git commit -m "Update images to tag ${IMAGE_TAG}" || echo "No changes"
          git push origin HEAD:main
